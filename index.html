<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부품 QR 일치 검사 시스템 - 태블릿 전용</title>
    <!-- Tailwind CSS (브라우저 CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- html5-qrcode (QR 및 바코드 스캔 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
      @font-face { font-family: 'GMarketSans'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff'); font-weight: 300; font-display: swap; }
      @font-face { font-family: 'GMarketSans'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff'); font-weight: 500; font-display: swap; }
      @font-face { font-family: 'GMarketSans'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff'); font-weight: 700; font-display: swap; }
      html, body { font-family: "GMarketSans"; height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
      dialog::backdrop { background-color: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px); }
      #camera-reader video { border-radius: 1rem; object-fit: cover; width: 100% !important; }
      .scanner-laser { position: absolute; left: 8%; right: 8%; height: 4px; background: #2563eb; box-shadow: 0 0 14px #3b82f6; animation: scanLaser 2s linear infinite alternate; }
      @keyframes scanLaser { 0% { top: 12%; } 100% { top: 88%; } }
      .touch-press { user-select: none; transition: transform 0.08s ease, filter 0.08s ease; }
      .touch-press:active { transform: scale(0.96); filter: brightness(0.92); }
    </style>
  </head>
  <body class="h-screen h-[100dvh] w-screen bg-slate-100 text-slate-900 antialiased flex flex-col p-2.5 sm:p-3 select-none overflow-hidden">

    <!-- 1. 최상단 컴팩트 헤더 바 (높이 약 50px 고정) -->
    <header class="w-full bg-white rounded-2xl shadow-xs border border-slate-200 px-3 py-2 flex items-center justify-between shrink-0 mb-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white font-black text-xl flex items-center justify-center shadow-sm shadow-blue-300">
          Q
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black text-slate-800 leading-tight">부품 QR 일치 검사</h1>
          <p class="text-[11px] text-slate-400 font-bold leading-none">태블릿 전용 풀스크린 모드</p>
        </div>
      </div>

      <!-- 진행 상황 요약 & 상단 버튼 -->
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
          <span class="text-xs font-black text-slate-500">일치율</span>
          <div class="w-24 sm:w-32 bg-slate-200 rounded-full h-3 overflow-hidden">
            <div id="progress-bar-fill" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <span id="progress-text" class="text-xs sm:text-sm font-black text-emerald-600">0 / 4 (0%)</span>
        </div>

        <button
          id="btn-sound-toggle"
          onclick="window.toggleSound()"
          class="h-9 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center gap-1.5 border border-slate-300 touch-press"
        >
          <svg id="icon-sound-on" class="w-4 h-4 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
          <span id="txt-sound-state">효과음</span>
        </button>

        <button
          onclick="window.resetCurrentCheck()"
          class="h-9 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-black text-xs flex items-center gap-1 border border-rose-200 touch-press"
        >
          <svg class="w-4 h-4 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>리셋</span>
        </button>
      </div>
    </header>

    <!-- 2. 제품 품번 선택 및 상태 바 (높이 약 64px 고정) -->
    <section class="w-full bg-white rounded-2xl p-2.5 sm:p-3 shadow-xs border border-slate-200 shrink-0 mb-2 flex items-center justify-between gap-2 sm:gap-3">
      <!-- 제품 품번 인풋/표시창 -->
      <div class="flex-1 flex items-center gap-2">
        <span class="text-xs font-black text-slate-500 whitespace-nowrap hidden md:inline">제품품번:</span>
        <div class="relative flex-1">
          <input
            id="product-code-input"
            type="text"
            autocomplete="off"
            placeholder="제품 품번 스캔"
            class="w-full h-11 pl-3 pr-10 rounded-xl border-2 border-slate-300 focus:border-blue-600 focus:outline-none text-base sm:text-lg font-black uppercase tracking-wider bg-slate-50 focus:bg-white text-slate-900"
          />
          <button
            onclick="window.clearProductInput()"
            class="absolute right-2 top-1.5 w-8 h-8 rounded-lg bg-slate-200 text-slate-600 font-bold flex items-center justify-center touch-press text-sm"
          >
            ✕
          </button>
        </div>
      </div>

      <!-- 현재 로드된 제품명 표시 -->
      <div class="hidden lg:flex items-center gap-2 px-3 py-2 bg-blue-50 rounded-xl border border-blue-200">
        <span class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
        <span id="current-prod-name" class="text-xs sm:text-sm font-black text-blue-950 truncate max-w-[280px]">PRD-2026-X1 스마트폰 모듈</span>
      </div>

      <!-- 상단 액션 버튼 (제품 QR 스캔 & 제품 변경) -->
      <div class="flex items-center gap-2 shrink-0">
        <button
          onclick="window.openScannerModal('product')"
          class="h-11 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-sm flex items-center gap-1.5 shadow-sm touch-press"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
          </svg>
          <span>제품 QR스캔</span>
        </button>

        <button
          onclick="window.openProductSelectModal()"
          class="h-11 px-3 sm:px-4 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-black text-sm flex items-center gap-1.5 touch-press"
        >
          <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <span class="hidden sm:inline">품번목록</span>
        </button>

        <button
          onclick="window.openScannerModal('part-auto')"
          class="h-11 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm flex items-center gap-1.5 shadow-sm touch-press"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
          </svg>
          <span>부품 연속스캔</span>
        </button>
      </div>
    </section>

    <!-- 3. 메인 부품 검사 영역 (스크롤 없이 화면 100% 핏: flex-1 min-h-0) -->
    <main class="w-full flex-1 min-h-0 bg-white rounded-2xl p-2.5 sm:p-3 shadow-xs border border-slate-200 flex flex-col overflow-hidden">
      
      <!-- 부품 카드 컨테이너 (스크롤 없이 태블릿 화면에 자동 분할 핏) -->
      <div id="part-cards-container" class="w-full h-full grid grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-3 overflow-hidden">
        <!-- 동적으로 렌더링 -->
      </div>

    </main>

    <!-- 4. 하단 모든 부품 일치 완료 축하 배너 (완료 시만 오버레이 표시) -->
    <div id="complete-banner" class="hidden fixed inset-x-4 bottom-4 z-40 p-4 rounded-2xl bg-emerald-600 text-white shadow-2xl flex items-center justify-between gap-3 border-2 border-emerald-400">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-white/20 flex items-center justify-center text-2xl font-black shrink-0">✓</div>
        <div>
          <h3 class="text-lg sm:text-xl font-black">모든 장착 부품 사양 일치 완료!</h3>
          <p class="text-xs sm:text-sm text-emerald-100 font-bold">전체 규격이 100% 검증되었습니다. 다음 공정으로 이동하세요.</p>
        </div>
      </div>
      <button
        onclick="window.confirmNextStage()"
        class="h-12 px-6 rounded-xl bg-white text-emerald-800 font-black text-sm sm:text-base shadow-md hover:bg-emerald-50 touch-press whitespace-nowrap"
      >
        공정 완료 승인
      </button>
    </div>

    <!-- 스캐너 공통 모달 -->
    <dialog id="scanner-modal" class="rounded-3xl p-0 shadow-2xl border-0 overflow-hidden w-[95%] max-w-lg bg-white">
      <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-3.5 h-3.5 rounded-full bg-emerald-400 animate-pulse"></div>
          <span id="scanner-modal-title" class="text-lg font-black">QR 코드 스캔</span>
        </div>
        <button
          onclick="window.closeScannerModal()"
          class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center text-xl font-black touch-press"
        >
          ✕
        </button>
      </div>

      <div class="p-4 flex flex-col items-center">
        <div class="relative w-full aspect-square max-w-[300px] bg-slate-950 rounded-2xl overflow-hidden border-2 border-slate-700 flex items-center justify-center shadow-inner">
          <div id="camera-reader" class="w-full h-full"></div>
          <div class="scanner-laser pointer-events-none"></div>
          <div class="absolute w-44 h-44 border-2 border-dashed border-emerald-400 rounded-xl pointer-events-none flex items-center justify-center">
            <span class="text-[11px] font-bold text-white bg-black/70 px-2 py-1 rounded-md">QR을 사각형 안에 맞추세요</span>
          </div>
        </div>

        <p id="scanner-modal-desc" class="mt-3 text-sm font-bold text-slate-700 text-center">QR 코드를 카메라에 비춰주세요.</p>

        <!-- 원클릭 테스트 시뮬레이션 -->
        <div class="mt-3 w-full bg-slate-50 p-2.5 rounded-xl border border-slate-200">
          <div class="text-[11px] font-black text-slate-500 mb-1.5">테스트 시뮬레이션:</div>
          <div id="scanner-simulate-buttons" class="grid grid-cols-2 gap-1.5"></div>
        </div>
      </div>

      <div class="p-3 bg-slate-100 border-t border-slate-200 flex justify-end">
        <button
          onclick="window.closeScannerModal()"
          class="w-full h-11 rounded-xl bg-slate-300 hover:bg-slate-400 text-slate-800 font-black text-sm touch-press"
        >
          닫기
        </button>
      </div>
    </dialog>

    <!-- 제품 목록 선택 모달 -->
    <dialog id="product-select-modal" class="rounded-3xl p-0 shadow-2xl border-0 overflow-hidden w-[95%] max-w-md bg-white">
      <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 class="text-lg font-black">제품 품번 선택</h3>
        <button
          onclick="window.closeProductSelectModal()"
          class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center text-xl font-black touch-press"
        >
          ✕
        </button>
      </div>
      <div class="p-4 flex flex-col gap-2.5" id="product-list-options"></div>
      <div class="p-3 bg-slate-50 border-t border-slate-200 flex justify-end">
        <button
          onclick="window.closeProductSelectModal()"
          class="w-full h-11 rounded-xl bg-slate-200 text-slate-700 font-black text-sm touch-press"
        >
          취소
        </button>
      </div>
    </dialog>

    <!-- 토스트 알림창 -->
    <div
      id="result-toast"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-2xl shadow-2xl text-white font-black text-base flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none translate-y-4"
    >
      <div id="toast-icon" class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center text-xl"></div>
      <div id="toast-message" class="text-sm sm:text-base"></div>
    </div>

    <!-- 스크립트 영역 -->
    <script>
      // 1. 제품 및 부품 마스터 DB
      const PRODUCT_DATABASE = {
        'PRD-2026-X1': {
          productName: 'PRD-2026-X1 스마트폰 모듈',
          parts: [
            { id: 'P1', name: 'AP 프로세서', expectedCode: 'PART-AP-8890', location: 'U101', status: 'READY', scannedCode: null },
            { id: 'P2', name: '16GB RAM', expectedCode: 'PART-RAM-16G', location: 'U202', status: 'READY', scannedCode: null },
            { id: 'P3', name: '512GB 스토리지', expectedCode: 'PART-SSD-512G', location: 'U303', status: 'READY', scannedCode: null },
            { id: 'P4', name: '전원 PMIC 칩', expectedCode: 'PART-PMIC-99', location: 'U404', status: 'READY', scannedCode: null }
          ]
        },
        'PRD-2026-A2': {
          productName: 'PRD-2026-A2 차량용 IVI 모듈',
          parts: [
            { id: 'P1', name: '차량 AP 제어보드', expectedCode: 'PART-AUTO-AP99', location: 'BRD-01', status: 'READY', scannedCode: null },
            { id: 'P2', name: 'CAN-FD 통신칩', expectedCode: 'PART-CAN-FD05', location: 'COMM-01', status: 'READY', scannedCode: null },
            { id: 'P3', name: '8CH 오디오 앰프', expectedCode: 'PART-DSP-AMP8', location: 'AMP-01', status: 'READY', scannedCode: null },
            { id: 'P4', name: '전원 노이즈 필터', expectedCode: 'PART-PWR-FIL01', location: 'PWR-01', status: 'READY', scannedCode: null }
          ]
        },
        'PRD-2026-C3': {
          productName: 'PRD-2026-C3 산업용 PLC 유닛',
          parts: [
            { id: 'P1', name: '산업용 CPU 모듈', expectedCode: 'PART-PLC-CPU', location: 'SLOT-01', status: 'READY', scannedCode: null },
            { id: 'P2', name: '16CH 디지털입력', expectedCode: 'PART-PLC-DI16', location: 'SLOT-02', status: 'READY', scannedCode: null },
            { id: 'P3', name: '8CH 릴레이출력', expectedCode: 'PART-PLC-RO08', location: 'SLOT-03', status: 'READY', scannedCode: null },
            { id: 'P4', name: 'EtherCAT 통신', expectedCode: 'PART-ETH-CAT', location: 'SLOT-COMM', status: 'READY', scannedCode: null }
          ]
        }
      };

      // 상태 관리 변수
      let currentProductCode = 'PRD-2026-X1';
      let currentParts = JSON.parse(JSON.stringify(PRODUCT_DATABASE['PRD-2026-X1'].parts));
      let isSoundEnabled = true;
      let html5QrScanner = null;
      let currentScanTarget = 'product';
      let targetPartIndex = null;

      // 2. 효과음 처리 (Web Audio API)
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(type) {
        if (!isSoundEnabled) return;
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (type === 'pass') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(659.25, now);
            osc.frequency.setValueAtTime(880, now + 0.1);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
            if (navigator.vibrate) navigator.vibrate(70);
          } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.setValueAtTime(146.83, now + 0.12);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
            if (navigator.vibrate) navigator.vibrate([150, 70, 150]);
          } else if (type === 'complete') {
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((f, i) => {
              const o = audioCtx.createOscillator();
              const g = audioCtx.createGain();
              o.connect(g);
              g.connect(audioCtx.destination);
              o.frequency.setValueAtTime(f, now + i * 0.08);
              g.gain.setValueAtTime(0.2, now + i * 0.08);
              g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
              o.start(now + i * 0.08);
              o.stop(now + i * 0.08 + 0.25);
            });
            if (navigator.vibrate) navigator.vibrate([100, 50, 150]);
          }
        } catch (e) {
          console.warn('Audio err:', e);
        }
      }

      // 3. 토스트 알림창
      function showToast(message, isSuccess = true) {
        const toast = document.getElementById('result-toast');
        const toastMsg = document.getElementById('toast-message');
        const toastIcon = document.getElementById('toast-icon');

        toastMsg.innerText = message;
        if (isSuccess) {
          toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-2xl shadow-2xl text-white font-black text-base flex items-center gap-3 transition-all duration-300 opacity-100 translate-y-0 bg-emerald-600';
          toastIcon.innerHTML = '✓';
        } else {
          toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3.5 rounded-2xl shadow-2xl text-white font-black text-base flex items-center gap-3 transition-all duration-300 opacity-100 translate-y-0 bg-rose-600 ring-2 ring-rose-300';
          toastIcon.innerHTML = '✕';
        }

        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-4');
        }, 2600);
      }

      // 4. 부품 카드 목록 렌더링 (화면 100% 핏)
      function renderPartList() {
        const container = document.getElementById('part-cards-container');
        container.innerHTML = '';

        let passCount = 0;

        currentParts.forEach((part, index) => {
          if (part.status === 'PASS') passCount++;

          const card = document.createElement('div');

          let cardStyle = 'border-slate-300 bg-slate-50/70';
          let statusBadge = '<span class="px-2 py-0.5 rounded-md bg-slate-200 text-slate-700 font-black text-xs">대기중</span>';
          let scanBtnColor = 'bg-blue-600 hover:bg-blue-700 text-white';

          if (part.status === 'PASS') {
            cardStyle = 'border-emerald-500 bg-emerald-50/70 ring-2 ring-emerald-300';
            statusBadge = '<span class="px-2.5 py-0.5 rounded-md bg-emerald-600 text-white font-black text-xs flex items-center gap-1 shadow-xs">✓ 일치 (OK)</span>';
            scanBtnColor = 'bg-emerald-600 text-white';
          } else if (part.status === 'FAIL') {
            cardStyle = 'border-rose-500 bg-rose-50/70 ring-2 ring-rose-300';
            statusBadge = '<span class="px-2.5 py-0.5 rounded-md bg-rose-600 text-white font-black text-xs flex items-center gap-1 shadow-xs">✕ 불일치 (NG)</span>';
            scanBtnColor = 'bg-rose-600 hover:bg-rose-700 text-white';
          }

          card.className = `rounded-2xl p-3 border-2 transition-all flex flex-col justify-between overflow-hidden shadow-xs ${cardStyle}`;

          card.innerHTML = `
            <div class="flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-1 mb-1.5">
                  <span class="px-2 py-0.5 rounded-md bg-slate-200 text-slate-800 font-black text-[11px] font-mono">${part.location}</span>
                  ${statusBadge}
                </div>

                <!-- 부품명 -->
                <h3 class="text-base sm:text-lg font-black text-slate-900 leading-snug line-clamp-1">${part.name}</h3>

                <!-- 품번 정보 박스 -->
                <div class="mt-2 p-2 rounded-xl bg-white border border-slate-200 space-y-1 text-xs">
                  <div class="flex items-center justify-between">
                    <span class="text-slate-400 font-bold">요구</span>
                    <span class="font-black text-slate-900 font-mono tracking-tight">${part.expectedCode}</span>
                  </div>
                  <div class="flex items-center justify-between border-t border-slate-100 pt-1">
                    <span class="text-slate-400 font-bold">스캔</span>
                    <span class="font-black font-mono tracking-tight ${part.scannedCode ? (part.status === 'PASS' ? 'text-emerald-600' : 'text-rose-600') : 'text-slate-300'}">
                      ${part.scannedCode || '미스캔'}
                    </span>
                  </div>
                </div>
              </div>

              <!-- 하단 스캔 버튼 (터치 최적화) -->
              <div class="mt-2 pt-1 flex items-center gap-1.5">
                <button
                  onclick="window.openScannerModal('part', ${index})"
                  class="flex-1 h-11 rounded-xl ${scanBtnColor} font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 shadow-xs touch-press"
                >
                  <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                  </svg>
                  <span>QR스캔</span>
                </button>

                <!-- 빠른 테스트 버튼 -->
                <button
                  onclick="window.quickSimulatePart(${index}, true)"
                  class="h-11 px-2.5 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-black text-xs border border-emerald-300 touch-press"
                  title="일치 테스트"
                >
                  OK
                </button>
                <button
                  onclick="window.quickSimulatePart(${index}, false)"
                  class="h-11 px-2.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-black text-xs border border-rose-300 touch-press"
                  title="오류 테스트"
                >
                  NG
                </button>
              </div>
            </div>
          `;

          container.appendChild(card);
        });

        // 진행률 업데이트
        const total = currentParts.length;
        const percent = total > 0 ? Math.round((passCount / total) * 100) : 0;
        document.getElementById('progress-bar-fill').style.width = percent + '%';
        document.getElementById('progress-text').innerText = `${passCount} / ${total} (${percent}%)`;

        // 완료 배너
        const banner = document.getElementById('complete-banner');
        if (total > 0 && passCount === total) {
          banner.classList.remove('hidden');
          playSound('complete');
        } else {
          banner.classList.add('hidden');
        }
      }

      // 5. 검사 판별 로직
      function verifyScannedCode(scannedCode, specificIndex = null) {
        if (!scannedCode) return;
        const cleanCode = scannedCode.trim().toUpperCase();

        if (specificIndex !== null && currentParts[specificIndex]) {
          const part = currentParts[specificIndex];
          part.scannedCode = cleanCode;

          if (part.expectedCode.toUpperCase() === cleanCode) {
            part.status = 'PASS';
            playSound('pass');
            showToast(`[일치 OK] ${part.name} 정상 검증!`, true);
          } else {
            part.status = 'FAIL';
            playSound('fail');
            showToast(`[불일치 NG] ${part.name} 규격 불일치!`, false);
          }
          renderPartList();
          return;
        }

        // 연속 스캔 자동 매칭
        let matchIndex = currentParts.findIndex(p => p.expectedCode.toUpperCase() === cleanCode && p.status !== 'PASS');
        if (matchIndex !== -1) {
          const part = currentParts[matchIndex];
          part.scannedCode = cleanCode;
          part.status = 'PASS';
          playSound('pass');
          showToast(`[일치 OK] ${part.name} 일치 확인!`, true);
          renderPartList();
          return;
        }

        const doneIndex = currentParts.findIndex(p => p.expectedCode.toUpperCase() === cleanCode && p.status === 'PASS');
        if (doneIndex !== -1) {
          showToast(`[완료] 이미 검증된 부품입니다: ${currentParts[doneIndex].name}`, true);
          return;
        }

        playSound('fail');
        showToast(`[오장착 NG] 목록에 없는 부품: ${cleanCode}`, false);
      }

      // ==========================================
      // 전역 window 바인딩 함수 (규칙 준수)
      // ==========================================

      window.toggleSound = function() {
        isSoundEnabled = !isSoundEnabled;
        const icon = document.getElementById('icon-sound-on');
        const text = document.getElementById('txt-sound-state');
        if (isSoundEnabled) {
          text.innerText = '효과음';
          icon.classList.remove('text-slate-400');
          icon.classList.add('text-blue-600');
          playSound('pass');
        } else {
          text.innerText = '음소거';
          icon.classList.remove('text-blue-600');
          icon.classList.add('text-slate-400');
        }
      };

      window.clearProductInput = function() {
        const inp = document.getElementById('product-code-input');
        inp.value = '';
        inp.focus();
      };

      window.openProductSelectModal = function() {
        const modal = document.getElementById('product-select-modal');
        const listDiv = document.getElementById('product-list-options');
        listDiv.innerHTML = '';

        Object.keys(PRODUCT_DATABASE).forEach(code => {
          const item = PRODUCT_DATABASE[code];
          const btn = document.createElement('button');
          btn.className = `w-full h-14 p-3 rounded-xl font-black text-left flex items-center justify-between border-2 touch-press ${code === currentProductCode ? 'bg-blue-50 border-blue-600 text-blue-900' : 'bg-slate-50 border-slate-200 text-slate-800'}`;
          btn.innerHTML = `
            <div>
              <div class="text-[11px] text-blue-600 font-bold">${code}</div>
              <div class="text-sm font-black">${item.productName}</div>
            </div>
            <span class="text-xs font-bold bg-white px-2.5 py-1 rounded-lg border border-slate-300">${item.parts.length}개 부품</span>
          `;
          btn.onclick = () => {
            window.selectProduct(code);
            window.closeProductSelectModal();
          };
          listDiv.appendChild(btn);
        });

        modal.showModal();
      };

      window.closeProductSelectModal = function() {
        const modal = document.getElementById('product-select-modal');
        if (modal.open) modal.close();
      };

      window.selectProduct = function(code) {
        document.getElementById('product-code-input').value = code;
        window.loadProductParts();
      };

      window.loadProductParts = function() {
        const code = document.getElementById('product-code-input').value.trim().toUpperCase();
        if (!code) {
          showToast('제품 품번을 입력하거나 스캔해주세요.', false);
          return;
        }

        if (PRODUCT_DATABASE[code]) {
          currentProductCode = code;
          const prod = PRODUCT_DATABASE[code];
          document.getElementById('current-prod-name').innerText = prod.productName;
          currentParts = JSON.parse(JSON.stringify(prod.parts));
          renderPartList();
          playSound('pass');
          showToast(`제품 [${code}] 부품 목록 로드 완료`, true);
        } else {
          currentProductCode = code;
          document.getElementById('current-prod-name').innerText = `사용자 제품 (${code})`;
          currentParts = [
            { id: 'P1', name: '메인 제어 보드', expectedCode: `${code}-MAIN`, location: 'LOC-01', status: 'READY', scannedCode: null },
            { id: 'P2', name: '전원 공급 모듈', expectedCode: `${code}-PWR`, location: 'LOC-02', status: 'READY', scannedCode: null },
            { id: 'P3', name: '센서 인터페이스', expectedCode: `${code}-SEN`, location: 'LOC-03', status: 'READY', scannedCode: null }
          ];
          renderPartList();
          playSound('pass');
          showToast(`신규 품번 [${code}] 생성 완료`, true);
        }
      };

      window.resetCurrentCheck = function() {
        if (confirm('부품 검사 상태를 리셋하시겠습니까?')) {
          if (PRODUCT_DATABASE[currentProductCode]) {
            currentParts = JSON.parse(JSON.stringify(PRODUCT_DATABASE[currentProductCode].parts));
          } else {
            currentParts.forEach(p => { p.status = 'READY'; p.scannedCode = null; });
          }
          renderPartList();
          showToast('초기화되었습니다.', true);
        }
      };

      window.quickSimulatePart = function(index, isCorrect) {
        const part = currentParts[index];
        if (!part) return;
        const code = isCorrect ? part.expectedCode : `${part.expectedCode}-ERR`;
        verifyScannedCode(code, index);
      };

      window.confirmNextStage = function() {
        playSound('complete');
        alert(`[공정 승인 완료]\n제품: ${currentProductCode}\n모든 부품이 성공적으로 검증되었습니다.`);
      };

      window.openScannerModal = function(targetType, partIdx = null) {
        currentScanTarget = targetType;
        targetPartIndex = partIdx;

        const modal = document.getElementById('scanner-modal');
        const title = document.getElementById('scanner-modal-title');
        const desc = document.getElementById('scanner-modal-desc');
        const simBtns = document.getElementById('scanner-simulate-buttons');

        simBtns.innerHTML = '';

        if (targetType === 'product') {
          title.innerText = '제품 품번 QR 스캔';
          desc.innerText = '제품 라벨의 QR 코드를 프레임 안에 맞추세요.';
          simBtns.innerHTML = `
            <button onclick="window.simulateScanResult('PRD-2026-X1')" class="h-10 bg-blue-100 hover:bg-blue-200 text-blue-900 rounded-xl font-black text-xs touch-press">PRD-2026-X1 인식</button>
            <button onclick="window.simulateScanResult('PRD-2026-A2')" class="h-10 bg-blue-100 hover:bg-blue-200 text-blue-900 rounded-xl font-black text-xs touch-press">PRD-2026-A2 인식</button>
          `;
        } else if (targetType === 'part-auto') {
          title.innerText = '부품 연속 QR 스캔';
          desc.innerText = '조립할 부품의 QR 코드를 차례대로 비춰주세요.';
          currentParts.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'h-10 bg-emerald-100 hover:bg-emerald-200 text-emerald-900 rounded-xl font-black text-xs touch-press truncate px-2';
            btn.innerText = `${p.name} 일치`;
            btn.onclick = () => window.simulateScanResult(p.expectedCode);
            simBtns.appendChild(btn);
          });
          const wrongBtn = document.createElement('button');
          wrongBtn.className = 'h-10 bg-rose-100 hover:bg-rose-200 text-rose-900 rounded-xl font-black text-xs touch-press';
          wrongBtn.innerText = '불일치(NG) 테스트';
          wrongBtn.onclick = () => window.simulateScanResult('WRONG-CODE-999');
          simBtns.appendChild(wrongBtn);
        } else if (targetType === 'part' && partIdx !== null) {
          const part = currentParts[partIdx];
          title.innerText = `[${part.name}] 스캔`;
          desc.innerText = `요구 규격: ${part.expectedCode}`;
          simBtns.innerHTML = `
            <button onclick="window.simulateScanResult('${part.expectedCode}')" class="h-10 bg-emerald-100 hover:bg-emerald-200 text-emerald-900 rounded-xl font-black text-xs touch-press">정상 일치 (OK)</button>
            <button onclick="window.simulateScanResult('${part.expectedCode}-ERR')" class="h-10 bg-rose-100 hover:bg-rose-200 text-rose-900 rounded-xl font-black text-xs touch-press">불일치 (NG)</button>
          `;
        }

        modal.showModal();
        startCameraScanner();
      };

      window.closeScannerModal = function() {
        stopCameraScanner();
        const modal = document.getElementById('scanner-modal');
        if (modal.open) modal.close();
      };

      window.simulateScanResult = function(text) {
        handleQrDetected(text);
        window.closeScannerModal();
      };

      function startCameraScanner() {
        if (typeof Html5Qrcode === 'undefined') return;
        if (html5QrScanner) stopCameraScanner();

        html5QrScanner = new Html5Qrcode("camera-reader");
        const config = { fps: 10, qrbox: { width: 200, height: 200 } };

        html5QrScanner.start(
          { facingMode: "environment" },
          config,
          (decodedText) => {
            handleQrDetected(decodedText);
            if (currentScanTarget !== 'part-auto') {
              window.closeScannerModal();
            }
          },
          () => {}
        ).catch(err => {
          console.warn("Camera start err:", err);
          document.getElementById('scanner-modal-desc').innerHTML = `
            <span class="text-rose-600 font-bold">카메라 권한을 확인해주세요.</span><br>
            <span class="text-xs text-slate-500">터치 환경에서는 시뮬레이션 버튼 또는 스캐너 건을 사용할 수 있습니다.</span>
          `;
        });
      }

      function stopCameraScanner() {
        if (html5QrScanner) {
          html5QrScanner.stop().then(() => {
            html5QrScanner.clear();
            html5QrScanner = null;
          }).catch(() => {
            html5QrScanner = null;
          });
        }
      }

      function handleQrDetected(text) {
        if (!text) return;
        const scanned = text.trim();

        if (currentScanTarget === 'product') {
          document.getElementById('product-code-input').value = scanned;
          window.loadProductParts();
        } else if (currentScanTarget === 'part') {
          verifyScannedCode(scanned, targetPartIndex);
        } else if (currentScanTarget === 'part-auto') {
          verifyScannedCode(scanned);
        }
      }

      // 초기화 및 리스너 등록
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('product-code-input').value = currentProductCode;
        renderPartList();

        document.getElementById('product-code-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            window.loadProductParts();
          }
        });

        // 전역 스캐너 건 키보드 버퍼 리스너
        let barcodeBuffer = '';
        let lastKeyTime = Date.now();

        document.addEventListener('keydown', (e) => {
          const activeEl = document.activeElement;
          if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
            return;
          }

          const currentTime = Date.now();
          if (currentTime - lastKeyTime > 150) {
            barcodeBuffer = '';
          }
          lastKeyTime = currentTime;

          if (e.key === 'Enter') {
            if (barcodeBuffer.length >= 3) {
              verifyScannedCode(barcodeBuffer);
            }
            barcodeBuffer = '';
          } else if (e.key.length === 1) {
            barcodeBuffer += e.key;
          }
        });

        const scanModal = document.getElementById('scanner-modal');
        scanModal.addEventListener('click', (e) => {
          if (e.target === scanModal) window.closeScannerModal();
        });

        const prodModal = document.getElementById('product-select-modal');
        prodModal.addEventListener('click', (e) => {
          if (e.target === prodModal) window.closeProductSelectModal();
        });
      });
    </script>
  </body>
</html>
